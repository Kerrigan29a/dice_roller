name: Check all implementations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
          enable-cache: true
      - run: make bootstrap
      - run: uv run --locked -- npm exec -- playwright install --with-deps chromium firefox
      - run: make test
